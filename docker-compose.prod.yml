# Stack completo para VERIFICAR los Dockerfiles localmente (no es el deploy real;
# en Coolify cada app se despliega con su propio Dockerfile).
#   docker compose -f docker-compose.prod.yml up -d --build
#   → web en http://localhost:8090, api en http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-pai_arbitrum}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-pai_arbitrum}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      DB_NAME: ${DB_NAME:-pai_arbitrum}
      API_PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8090}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8090}
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-cambiame_por_un_secreto_largo}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin1234!}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Allowlists de rol. Sin ellas todos entran como PYME: nadie llega a
      # /certificacion y el fondo no puede operar en /prestamo, o sea que la
      # demo de tres certificadores no existe. Son opcionales en el schema, así
      # que el default vacío es legítimo — `role-mapping` descarta los vacíos.
      CERTIFIER_EMAILS: ${CERTIFIER_EMAILS:-}
      FUND_EMAILS: ${FUND_EMAILS:-}
      # Cookie de sesión. Estas dos no admiten '': el schema las valida como
      # enum y como flag booleano, así que el default va con valor, no vacío.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Google OAuth: opcional. Con '' en CLIENT_ID o CLIENT_SECRET el botón no
      # aparece y las rutas devuelven 404, que es el comportamiento esperado.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
      # Storage de evidencias: el schema de env las exige con cualquier adapter.
      # Sin ellas la API ni siquiera arranca, así que `:?` corta en `up` con el
      # nombre de la variable en vez de dejar el contenedor en crash loop.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-pai-evidence}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?define STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?define STORAGE_SECRET_KEY}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-false}
      # Cadena real. Sin esto el default del schema es `in-memory`: el panel
      # queda en "offline" y los hashes son sintéticos. Las direcciones no se
      # hornean aquí a propósito — su fuente única es `chain/deployments/<id>.json`
      # y un valor pegado en este archivo envejece con el siguiente redespliegue.
      CHAIN_ADAPTER: arbitrum
      CHAIN_ID: ${CHAIN_ID:-421614}
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}
      CHAIN_EXPLORER_URL: ${CHAIN_EXPLORER_URL:-https://sepolia.arbiscan.io}
      CHAIN_DEPLOYMENT_BLOCK: ${CHAIN_DEPLOYMENT_BLOCK:?define CHAIN_DEPLOYMENT_BLOCK}
      ASSET_REGISTRY_ADDRESS: ${ASSET_REGISTRY_ADDRESS:?define ASSET_REGISTRY_ADDRESS}
      CERTIFICATION_ATTESTOR_ADDRESS: ${CERTIFICATION_ATTESTOR_ADDRESS:?define CERTIFICATION_ATTESTOR_ADDRESS}
      PAI_CERTIFICATE_ADDRESS: ${PAI_CERTIFICATE_ADDRESS:?define PAI_CERTIFICATE_ADDRESS}
      BORROWING_BASE_ENGINE_ADDRESS: ${BORROWING_BASE_ENGINE_ADDRESS:?define BORROWING_BASE_ENGINE_ADDRESS}
      COLLATERAL_VAULT_ADDRESS: ${COLLATERAL_VAULT_ADDRESS:?define COLLATERAL_VAULT_ADDRESS}
      MOCK_USDC_ADDRESS: ${MOCK_USDC_ADDRESS:?define MOCK_USDC_ADDRESS}
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # En esta verificación local el navegador pega directo a la API expuesta.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        # Declarada como ARG en apps/web/Dockerfile: sin pasarla, los enlaces al
        # explorer se hornean vacíos y el build no se queja.
        VITE_EXPLORER_TX_URL: ${VITE_EXPLORER_TX_URL:-https://sepolia.arbiscan.io/tx}
    ports:
      - '8090:80'
    depends_on:
      - api

volumes:
  pgdata_prod:
