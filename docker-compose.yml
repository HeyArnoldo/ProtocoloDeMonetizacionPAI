# Desarrollo local: solo la base de datos.
# Adminer (UI web para la DB) es opcional: docker compose --profile tools up -d
services:
  db:
    image: postgres:16-alpine
    container_name: pai-arbitrum-db
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-pai_arbitrum}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-pai_arbitrum}']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    profiles: ['tools']
    ports:
      - '${ADMINER_PORT:-8081}:8080'
    depends_on:
      db:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000
      ${STORAGE_ACCESS_KEY:-minioadmin} ${STORAGE_SECRET_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${STORAGE_BUCKET:-pai-evidence}"

volumes:
  pgdata:
  miniodata:
