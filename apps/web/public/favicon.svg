<!--
  Marca del protocolo: cuatro hojas del expediente, dos divulgadas y dos
  ocultas. Es la divulgacion selectiva reducida a una figura que sigue siendo
  legible a 16px, donde unas siglas ya no lo serian.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="7" fill="#161826" />
  <rect x="6" y="6" width="9" height="9" rx="2" fill="#9184d9" />
  <rect x="17" y="6" width="9" height="9" rx="2" fill="#3f424d" />
  <rect x="6" y="17" width="9" height="9" rx="2" fill="#3f424d" />
  <rect x="17" y="17" width="9" height="9" rx="2" fill="#9184d9" />
</svg>
