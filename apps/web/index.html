<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>PAI · Protocolo de Monetización de Activos Intangibles</title>
    <meta
      name="description"
      content="Una PYME sin activos hipotecables convierte su cartera de derechos de cobro en colateral verificable sobre Arbitrum. El monto prestable no lo afirma un servidor: el prestamista lo recomputa."
    />
    <link rel="canonical" href="https://pai.cloud.groowtech.com/" />

    <!-- El panel es de tema oscuro unico: sin esto, el navegador pinta de blanco
         la barra de direcciones y el fondo antes del primer render. -->
    <meta name="theme-color" content="#161826" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph: lo que se ve al compartir el enlace en LinkedIn, Slack,
         Discord o WhatsApp. La imagen se genera con `pnpm og:generate`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Protocolo de Monetización PAI" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:url" content="https://pai.cloud.groowtech.com/" />
    <meta property="og:title" content="PAI · La garantía deja de ser una promesa" />
    <meta
      property="og:description"
      content="Derechos de cobro convertidos en colateral verificable sobre Arbitrum. Divulgación selectiva con Merkle, sin ZK, y un borrowing base que el prestamista recomputa."
    />
    <meta property="og:image" content="https://pai.cloud.groowtech.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="PAI × Arbitrum. Mapa de hojas del expediente con las cuotas divulgadas en color de acento y las ocultas en gris."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PAI · La garantía deja de ser una promesa" />
    <meta
      name="twitter:description"
      content="Derechos de cobro convertidos en colateral verificable sobre Arbitrum. Divulgación selectiva con Merkle, sin ZK, y un borrowing base que el prestamista recomputa."
    />
    <meta name="twitter:image" content="https://pai.cloud.groowtech.com/og-image.png" />

    <!-- El panel esta detras de autenticacion y solo la pagina publica de
         verificacion tiene valor en un buscador; no hay contenido indexable que
         perder, pero tampoco razon para bloquear el rastreo del enlace. -->
    <meta name="robots" content="index, follow" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
