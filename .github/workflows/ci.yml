name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permite relanzar el CI a mano desde la pestaña Actions sin tener que
  # inventar un commit vacío.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar corepack (pnpm pineado en packageManager)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Los tipos de los packages viven en su dist/: hay que compilarlos antes
      # de lint/typecheck o la api/web no resuelven los módulos.
      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Tests
        run: pnpm test

  # El job `ci` compila sobre el checkout completo del monorepo, así que nunca
  # ejerce el subconjunto de archivos que sí ve Docker: por eso un CI verde
  # convivió con un deploy roto (`Cannot find module '@app/merkle'`). Este job
  # construye las mismas imágenes que Coolify, y es lo único que lo detecta.
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Sin `load` ni `push`: solo interesa que la imagen construya.
      - name: Build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Job aparte: no comparte nada con el de Node y así los dos corren en
  # paralelo. Si el de contratos falla, el problema está en chain/.
  contracts:
    runs-on: ubuntu-latest
    steps:
      # Las librerías de Foundry (forge-std, openzeppelin-contracts) son
      # submódulos: sin esto, `forge build` no encuentra nada.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Formato de Solidity
        run: forge fmt --check
        working-directory: chain

      - name: Build
        run: forge build --sizes
        working-directory: chain

      # Los tests de vectores dorados leen packages/merkle/fixtures: prueban
      # que Solidity y TypeScript hashean exactamente igual.
      - name: Tests
        run: forge test -vvv
        working-directory: chain
